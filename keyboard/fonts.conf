<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Default font for sans-serif -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- Default font for serif -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <!-- Default font for monospace -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- Japanese (ja) language-specific font preferences.
       Noto CJK ships JP/KR/SC/TC/HK as sub-families of one font; without
       these rules fontconfig can pick a non-JP glyph variant (e.g. KR) for
       lang=ja text, giving Chinese/Korean-style Han unification glyphs. -->
  <match target="pattern">
    <test qual="any" name="lang">
      <string>ja</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="lang">
      <string>ja</string>
    </test>
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Serif CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="lang">
      <string>ja</string>
    </test>
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans Mono CJK JP</string>
    </edit>
  </match>

  <!-- Thai (th) language-specific font preferences -->
  <match target="pattern">
    <test qual="any" name="lang">
      <string>th</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans Thai</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="lang">
      <string>th</string>
    </test>
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Serif Thai</string>
    </edit>
  </match>

  <!-- Optional: Fallback fonts for Thai -->
  <match target="pattern">
    <test qual="any" name="lang">
      <string>th</string>
    </test>
    <edit name="family" mode="append">
      <string>Garuda</string>
      <string>Loma</string>
      <string>Norasi</string>
    </edit>
  </match>

  <!-- Globally exclude non-Japanese Noto CJK sub-families from font
       matching. The lang=ja rules above only fire when an app tags its
       font query with lang="ja" (e.g. native toolkit text like a browser
       URL bar). Apps that do automatic glyph-fallback for a missing
       character (terminals, Electron apps, browser page content) query
       fontconfig without that hint and can silently land on the KR/SC/TC/HK
       glyph variant instead. Rejecting those sub-families outright forces
       every Han-glyph fallback, everywhere, onto the JP variant. -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Noto Sans CJK KR</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Noto Sans Mono CJK KR</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Noto Serif CJK KR</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Noto Sans CJK SC</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Noto Serif CJK SC</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Noto Sans CJK TC</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Noto Serif CJK TC</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Noto Sans CJK HK</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Noto Serif CJK HK</string>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
